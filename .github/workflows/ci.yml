name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - name: Install Python tools
        run: pip install -r .github/requirements-ci.txt
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('.github/requirements-ci.txt') }}
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Public repo scan (no secrets / real ids)
        run: python tools/scan_public.py
      - name: Standalone build is up to date
        run: |
          node app/build/build_standalone.mjs
          git diff --exit-code app/standalone
      - name: Lint (CloudFormation + store schema)
        run: make lint
      - name: API unit tests
        run: cd api && npm test
      - name: Playwright suites
        run: python tests/run_all.py
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-out
          path: tests/out
          retention-days: 7
